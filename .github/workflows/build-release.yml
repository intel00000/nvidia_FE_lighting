name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore NuGet packages
        run: nuget restore nvidia_FE_lighting.sln

      - name: Build C++ NvApiWrapper
        run: msbuild nvidia_FE_lighting.sln /p:Configuration=Release /p:Platform=x64 /m /t:NvApiWrapper

      - name: Single-file application (framework-dependent)
        run: dotnet publish nvidia_FE_lighting\nvidia_FE_lighting.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Package application
        run: |
          mkdir release-package
          Copy-Item -Path "publish\nvidia_FE_lighting.exe" -Destination "release-package\"
        shell: pwsh

      - name: Create README for release
        run: |
          @"
          # NVIDIA FE Lighting Control

          ## Installation
          1. Extract nvidia_FE_lighting.exe
          2. Run nvidia_FE_lighting.exe

          That's it! This is a standalone executable with everything bundled.

          ## Requirements
          - Windows 10/11 (64-bit)
          - .NET 8.0.x Runtime (https://dotnet.microsoft.com/download/dotnet/8.0)
          - NVIDIA drivers installed

          ## Features
          - Control RGB/RGBW illumination zones
          - 5 profile slots for saving/loading configurations
          - Apply settings automatically on startup
          - Dark-themed modern UI

          ## Usage
          1. Select GPU from the dropdown
          2. Click "Detect Zones" to find illumination zones
          3. Adjust colors and brightness for each zone
          4. Click "Apply All" to apply settings
          5. Save to profiles for quick switching
          6. Enable "Apply current settings on startup" for automatic application
          "@ | Out-File -FilePath "release-package\README.txt" -Encoding UTF8
        shell: pwsh

      - name: Create ZIP archive
        run: Compress-Archive -Path "release-package\*" -DestinationPath "FELighting-${{ github.ref_name }}.zip"
        shell: pwsh

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: windows-package
          path: FELighting-${{ github.ref_name }}.zip
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    container: ubuntu:22.04

    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gcc libc6-dev make git ca-certificates binutils

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Build felight
        run: |
          make -C linux
          readelf -d linux/felight | grep NEEDED
          linux/felight version

      - name: Package Linux files
        run: |
          mkdir -p release-package/nvidia-fe-lighting
          cp linux/felight linux/fe_lighting_gui.py linux/fe-lighting-startup.sh linux/README.md release-package/nvidia-fe-lighting/
          cp -r linux/fe_lighting release-package/nvidia-fe-lighting/
          tar -C release-package -czf "FELighting-linux-x86_64-${{ github.ref_name }}.tar.gz" nvidia-fe-lighting

      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: linux-package
          path: FELighting-linux-x86_64-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/FELighting-${{ github.ref_name }}.zip
            dist/FELighting-linux-x86_64-${{ github.ref_name }}.tar.gz
          body: |
            ## NVIDIA FE Lighting Control - ${{ github.ref_name }}

            **Windows:** download `FELighting-${{ github.ref_name }}.zip`, extract, and run `nvidia_FE_lighting.exe`.
            - Windows 10/11 (64-bit), .NET 8.0.x Runtime ([Download here](https://dotnet.microsoft.com/download/dotnet/8.0)), NVIDIA drivers installed

            **Linux:** download `FELighting-linux-x86_64-${{ github.ref_name }}.tar.gz`, extract, and run `fe_lighting_gui.py` (GUI) or `felight` (command line).
            - x86_64, glibc 2.35 or newer (Ubuntu 22.04+), NVIDIA driver 525 or newer
            - GUI needs Python 3 with PyGObject, GTK 4 and libadwaita (installed by default on GNOME desktops)
            - See `README.md` inside the archive to apply your settings at boot (`felight service enable`) or at login (GUI)

            **Changes in this release:**
            - See commit history for details
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
